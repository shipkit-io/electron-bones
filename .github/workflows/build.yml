name: Build

on:
  push:
    branches:
      - main
  # Lets a branch run the packaging build by hand before it reaches main.
  workflow_dispatch:

jobs:
  build-mac-windows:
    # Keeps forks from running a packaging build. Compare the full repo name,
    # not the owner: when this repo last moved orgs the old owner check never
    # matched again and every run was silently `skipped` (LAC-7765).
    if: ${{ github.repository == 'shipkit-io/electron-bones' }}

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm install
          npm run postinstall
          npm run package:mw

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac-windows
          path: |
            release/build
            !release/**/builder*
            !release/**/linux*
            !release/**/mac*
            !release/**/win*

  build-linux:
    # Keeps forks from running a packaging build. Compare the full repo name,
    # not the owner: when this repo last moved orgs the old owner check never
    # matched again and every run was silently `skipped` (LAC-7765).
    if: ${{ github.repository == 'shipkit-io/electron-bones' }}

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: sudo apt install libarchive-tools

      - name: Install and build
        run: |
          npm install
          npm run postinstall
          npm run package:linux

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/build
            !release/**/builder*
            !release/**/linux*
            !release/**/mac*
            !release/**/win*
